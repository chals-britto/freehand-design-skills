<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Enhanced Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Lato:wght@400;700&family=Roboto:wght@400;500;700&family=Rubik:wght@400;500;600&display=swap">
<style>
/* Layout: one neutral switcher strip on top; below it, a full-height product shell rendered in the chosen design language.
   Each skin deliberately commits to its product's light theme, so every colour is set explicitly per skin. */
:root{color-scheme:light;--sw-bg:#141416;--sw-fg:#F4F4F5;--sw-sub:#A1A1AA;--sw-seg:#27272A;--sw-on:#FAFAFA;--sw-ontx:#141416;--fh:#FE6301}
html,body{height:100%}
body{background:#FFFFFF;color:#1F1F1F;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #2F6FED;outline-offset:1px}
.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;display:block}
.fill{fill:currentColor;stroke:none}
#shell{height:100%;display:flex;flex-direction:column}
#app{flex:1;min-height:0;position:relative}
.sk{height:100%;position:relative}
.dash{opacity:.55}
.ttl{display:flex;align-items:center;gap:8px}
.itip{position:relative;width:24px;height:24px;border:0;background:none;border-radius:6px;display:inline-grid;place-items:center;color:#94A3B8;padding:0;flex:none}
.itip:hover,.itip:focus-visible{color:var(--ith,#2F6FED);background:var(--itb,rgba(0,0,0,.05))}
.itip-t{display:none;position:absolute;left:0;top:calc(100% + 8px);z-index:30;width:max-content;max-width:320px;background:#0F172A;color:#F8FAFC;font:400 14px/1.45 Inter,system-ui,sans-serif;letter-spacing:normal;text-transform:none;text-align:left;padding:8px 12px;border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.24);white-space:normal}
.itip-t::before{content:"";position:absolute;left:8px;top:-4px;width:8px;height:8px;background:#0F172A;transform:rotate(45deg)}
.itip:hover .itip-t,.itip:focus .itip-t{display:block}
.sk-sentry{--ith:#6C5FC7;--itb:rgba(108,95,199,.1)}.sk-monday{--ith:#0073EA;--itb:#DCDFEC}.sk-clay{--ith:#111;--itb:#F0F0EF}.sk-zoho{--ith:#408DFB;--itb:#EEF5FF}.sk-outlook{--ith:#0F6CBD;--itb:#EBF3FC}.sk-zapier{--ith:#6B4EFF;--itb:#F0EDFF}
.var{margin-left:6px;font-size:.92em;color:#15803D}.var.bad{color:#DC2626}
.se-tbl th,.se-tbl td,.za-tbl th,.za-tbl td{padding-left:12px!important;padding-right:12px!important}
.vn{display:inline-block;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.za-tbl td{font-size:14px}.za-tbl .vn{max-width:120px}.za-pill{padding:0 8px!important;font-size:12px!important}
.se-main>*,.cl-main>*,.zo-main>*,.za-main>*{flex-shrink:0}
.se-tbl,.cl-tbl,.zo-tbl,.ol-tbl,.za-tbl{min-width:980px!important}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Switcher strip ---------- */
.sw{flex:none;display:flex;align-items:center;gap:16px;background:var(--sw-bg);color:var(--sw-fg);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font:500 14px/1 Inter,system-ui,sans-serif}
.sw-l{color:var(--sw-sub);white-space:nowrap}
.sw-l b{color:var(--sw-fg);font-weight:600}
.sw-seg{display:flex;gap:2px;background:var(--sw-seg);border-radius:8px;padding:3px;overflow-x:auto;min-width:0}
.sw-seg button{border:0;background:none;color:var(--sw-sub);height:26px;padding:0 12px;border-radius:6px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.sw-seg button:hover{color:var(--sw-fg)}
.sw-seg button.on{background:var(--sw-on);color:var(--sw-ontx)}
.sw-seg .dot{width:8px;height:8px;border-radius:50%}
.sw-rst{margin-left:auto;border:1px solid #3F3F46;background:none;color:var(--sw-fg);height:28px;padding:0 10px;border-radius:6px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.sw-rst:hover{background:#27272A}
@media (max-width:700px){.sw-l{display:none}}

/* shared checkbox shell; skins colour it */
.cb{width:16px;height:16px;padding:0;border-radius:3px;display:inline-grid;place-items:center;background:#fff;border:1px solid #8A8886;flex:none;vertical-align:middle}
.cb .i{width:12px;height:12px;stroke-width:3;color:#fff}

/* shared toast shell */
.tst{position:fixed;z-index:50;display:flex;align-items:center;gap:12px;animation:tin .22s ease-out}
.tst .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.tst .tx b{font-weight:600}
.tst button{border:0;background:none;padding:0}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* =====================================================================
   SENTRY
   ===================================================================== */
.sk-sentry{--tx:#2B2233;--sub:#80708F;--bd:#E0DCE5;--bd2:#EBE6EF;--surf:#FAF9FB;--pur:#6C5FC7;--purh:#5D50B8;--hl:#F4F1FA;display:flex;background:#fff;color:var(--tx);font:400 14px/1.4 Rubik,"Avenir Next",system-ui,sans-serif}
.se-side{width:224px;flex:none;display:flex;flex-direction:column;gap:12px;padding:12px 10px;background:linear-gradient(294deg,#2F1937 35%,#452650 62%,#52305C 86%);color:rgba(255,255,255,.66)}
.se-org{display:flex;align-items:center;gap:10px;border:0;background:none;padding:6px;border-radius:6px;text-align:left;color:#fff}
.se-org:hover{background:rgba(255,255,255,.06)}
.se-orgav{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;background:#F2B712;color:#2F1937;font-weight:600}
.se-orgtx{display:flex;flex-direction:column;min-width:0;flex:1}
.se-orgtx b{font-weight:500;font-size:14px}
.se-orgtx small{font-size:12px;color:rgba(255,255,255,.55)}
.se-nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.se-ni{display:flex;align-items:center;gap:12px;height:36px;padding:0 10px;border-radius:6px;font-size:14px;position:relative;cursor:pointer}
.se-ni .i{width:18px;height:18px}
.se-ni:hover{color:#fff;background:rgba(255,255,255,.06)}
.se-ni.on{color:#fff;background:rgba(255,255,255,.1)}
.se-ni.on::before{content:"";position:absolute;left:-10px;top:6px;bottom:6px;width:4px;border-radius:0 4px 4px 0;background:#A396DA}
.se-navl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.4);padding:14px 10px 6px}
.se-user{display:flex;align-items:center;gap:10px;padding:8px 6px;border-top:1px solid rgba(255,255,255,.1)}
.se-user span:last-child{display:flex;flex-direction:column;min-width:0}
.se-user b{color:#fff;font-weight:500}
.se-user small{font-size:12px}
.se-uav{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#E1567C;color:#fff;font-weight:600;flex:none}
.se-main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:auto}
.se-head{padding:20px 32px 0;border-bottom:1px solid var(--bd)}
.se-crumb{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:14px}
.se-crumb .i{width:12px;height:12px}
.se-crumb span{color:var(--tx)}
.se-tr{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-top:8px}
.se-tr h1{margin:0;font-size:22px;font-weight:600;line-height:1.3}
.se-tr p{margin:4px 0 0;color:var(--sub);max-width:62ch}
.se-bb{display:flex;gap:8px;flex-wrap:wrap}
.se-btn{height:32px;padding:0 12px;border:1px solid var(--bd);border-radius:6px;background:#fff;color:#3E3446;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:0 2px 0 rgba(43,34,51,.04)}
.se-btn:hover{border-color:#C6C0CC;background:var(--surf)}
.se-btn.pri{background:var(--pur);border-color:var(--purh);color:#fff;box-shadow:0 2px 0 rgba(43,34,51,.08)}
.se-btn.pri:hover{background:var(--purh)}
.se-btn.sm{height:26px;padding:0 10px;font-size:12px}
.se-btn.dg{color:#CF2126}
.se-btn[disabled]{opacity:.5;cursor:default}
.se-bdg{display:inline-flex;align-items:center;justify-content:center;height:18px;min-width:18px;padding:0 6px;border-radius:9px;background:#F0ECF3;color:var(--sub);font-size:12px;font-weight:600}
.se-tabs{display:flex;gap:24px;margin-top:20px;overflow-x:auto}
.se-tab{border:0;background:none;padding:0 0 10px;font-size:14px;color:var(--sub);border-bottom:4px solid transparent;display:flex;align-items:center;gap:6px;white-space:nowrap}
.se-tab:hover{color:var(--tx)}
.se-tab.on{color:var(--tx);border-color:var(--pur)}
.se-tab.on .se-bdg{background:var(--pur);color:#fff}
.se-body{padding:20px 32px 32px;display:flex;flex-direction:column;gap:16px}
.se-bar{display:flex;gap:8px;flex-wrap:wrap}
.se-join{display:inline-flex}
.se-join>*{border-radius:0;margin-left:-1px}
.se-join>:first-child{border-radius:6px 0 0 6px;margin-left:0}
.se-join>:last-child{border-radius:0 6px 6px 0}
.se-search{flex:1;min-width:240px;height:32px;display:flex;align-items:center;gap:8px;padding:0 10px;border:1px solid var(--bd);border-radius:6px;color:var(--sub);box-shadow:inset 0 2px 0 rgba(43,34,51,.04)}
.se-search:focus-within{border-color:var(--pur);box-shadow:0 0 0 1px var(--pur)}
.se-search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;color:var(--tx)}
.se-panel{border:1px solid var(--bd);border-radius:6px;overflow:auto;box-shadow:0 2px 0 rgba(43,34,51,.04)}
.se-tbl{border-collapse:collapse;width:100%;min-width:1080px}
.se-tbl th{background:var(--surf);color:var(--sub);text-transform:uppercase;font-size:12px;font-weight:600;letter-spacing:.02em;text-align:left;padding:0 16px;height:40px;border-bottom:1px solid var(--bd);white-space:nowrap}
.se-tbl td{padding:0 16px;height:48px;border-top:1px solid var(--bd2);white-space:nowrap;font-variant-numeric:tabular-nums}
.se-tbl tbody tr:first-child td{border-top:0}
.se-tbl tbody tr:hover,.se-tbl tbody tr.sel{background:var(--hl)}
.se-tbl .se-cbc{width:44px;padding-right:0}
.se-tbl .idc{color:var(--pur);font-weight:500}
.se-tbl .vc{font-family:"Roboto Mono",ui-monospace,Menlo,monospace;font-size:12px;color:var(--sub)}
.se-tbl .c-pay{display:flex;align-items:center;gap:6px;height:48px}
.se-tbl .pt{color:var(--sub)}
.se-bulk{text-transform:none!important;letter-spacing:0!important}
.se-bulk>div{display:flex;align-items:center;gap:8px;color:var(--tx);font-size:14px;font-weight:500}
.se-bulk .lnk{border:0;background:none;color:var(--pur);font-size:14px;margin-left:4px}
.se-tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:20px;font-size:12px;font-weight:500}
.sk-sentry .t-info{background:rgba(60,116,221,.1);color:#2562D4}
.sk-sentry .t-ok{background:rgba(43,161,133,.12);color:#207964}
.sk-sentry .t-warn{background:rgba(245,176,0,.16);color:#8A6200}
.sk-sentry .t-bad{background:rgba(245,84,89,.12);color:#CF2126}
.sk-sentry .t-mute{background:#F0ECF3;color:#71637E}
.sk-sentry .t-acc{background:rgba(108,95,199,.12);color:var(--purh)}
.sk-sentry .cb{border-color:#C6C0CC;border-radius:4px}
.sk-sentry .cb.on,.sk-sentry .cb.mix{background:var(--pur);border-color:var(--pur)}
.se-empty{text-align:center;height:160px!important;color:var(--sub)}
.se-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--sub);font-size:14px}
.se-foot .lnk{border:0;background:none;color:var(--sub);display:inline-flex;gap:4px;align-items:center;font-size:14px;text-decoration:underline dotted;text-underline-offset:3px}
.se-pg{display:flex;align-items:center;gap:12px}
.sk-sentry .tst{left:24px;bottom:24px;background:#2B1D38;color:#fff;border-radius:6px;padding:12px 14px;box-shadow:0 4px 24px rgba(43,34,51,.28);font-size:14px}
.sk-sentry .tst .ok{color:#3FD1A9}
.sk-sentry .tst .tx span{color:rgba(255,255,255,.7);font-size:14px}
.sk-sentry .tst .ac{color:#B9AEF2;font-weight:500}
.sk-sentry .tst .x{color:rgba(255,255,255,.6)}

/* =====================================================================
   MONDAY (Vibe)
   ===================================================================== */
.sk-monday{--tx:#323338;--sub:#676879;--bd:#D0D4E4;--ui:#C3C6D4;--blue:#0073EA;--blueh:#0060B9;--hov:#DCDFEC;--hl:#CCE5FF;--shell:#F6F7FB;display:grid;grid-template-columns:248px 1fr;grid-template-rows:48px 1fr;background:var(--shell);color:var(--tx);font:400 14px/1.4 Figtree,Poppins,system-ui,sans-serif}
.mo-top{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:0 16px}
.mo-top .sp{flex:1}
.mo-ib{width:32px;height:32px;border:0;background:none;border-radius:4px;display:grid;place-items:center;color:var(--tx)}
.mo-ib:hover{background:var(--hov)}
.mo-ib .i{width:20px;height:20px}
.mo-av{width:32px;height:32px;border-radius:50%;background:#FE6301;color:#fff;display:grid;place-items:center;font-weight:600}
.mo-side{padding:8px 12px 16px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.mo-ws{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;border:0;background:none;text-align:left;margin-bottom:8px}
.mo-ws:hover{background:var(--hov)}
.mo-wsi{width:28px;height:28px;border-radius:8px;background:#FF7575;color:#fff;display:grid;place-items:center;font-weight:700;position:relative}
.mo-ws b{flex:1;font-weight:600;font-size:14px}
.mo-sl{font-size:12px;color:var(--sub);padding:12px 8px 4px}
.mo-ni{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border-radius:4px;cursor:pointer}
.mo-ni .i{width:18px;height:18px;color:var(--sub)}
.mo-ni:hover{background:var(--hov)}
.mo-ni.on{background:var(--hl)}
.mo-board{background:#fff;border-radius:16px 0 0 0;box-shadow:0 0 0 1px rgba(208,212,228,.6);overflow:auto;padding:20px 32px 40px;min-width:0}
.mo-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mo-h h1{font-size:24px;font-weight:500;margin:0 4px 0 0;line-height:1.3}
.mo-h .sp{flex:1}
.mo-gb{height:32px;padding:0 8px;border:0;background:none;border-radius:4px;display:inline-flex;align-items:center;gap:6px;color:var(--tx);white-space:nowrap}
.mo-gb:hover{background:var(--hov)}
.mo-gb .i{width:18px;height:18px}
.mo-desc{color:var(--sub);margin:2px 0 0}
.mo-tabs{display:flex;border-bottom:1px solid var(--ui);margin-top:16px;overflow-x:auto}
.mo-tab{height:40px;padding:0 12px;border:0;background:none;display:flex;align-items:center;gap:6px;position:relative;white-space:nowrap;border-radius:4px 4px 0 0}
.mo-tab:hover{background:var(--hov)}
.mo-tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--blue)}
.mo-ct{min-width:20px;height:18px;padding:0 6px;border-radius:9px;background:#E7E9EF;color:var(--sub);font-size:12px;display:inline-grid;place-items:center}
.mo-tab.on .mo-ct{background:var(--blue);color:#fff}
.mo-tb{display:flex;align-items:center;gap:4px;margin:16px 0 4px;flex-wrap:wrap}
.mo-split{display:inline-flex;height:32px;border-radius:4px;overflow:hidden;margin-right:8px}
.mo-split button{border:0;background:var(--blue);color:#fff;padding:0 12px;display:flex;align-items:center;gap:6px}
.mo-split button:hover{background:var(--blueh)}
.mo-split button+button{padding:0 8px;border-left:1px solid rgba(255,255,255,.35)}
.mo-search{height:32px;width:220px;display:flex;align-items:center;gap:6px;padding:0 8px;border:1px solid transparent;border-radius:4px;color:var(--sub)}
.mo-search:hover{border-color:var(--ui)}
.mo-search:focus-within{border-color:var(--blue)}
.mo-search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;color:var(--tx)}
.mo-tb .tot{margin-left:auto;color:var(--sub)}
.mo-g{margin-top:28px}
.mo-gh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mo-gh .i{width:20px;height:20px}
.mo-gh b{font-size:18px;font-weight:500}
.mo-gh span{color:var(--sub)}
.mo-scroll{overflow-x:auto}
.mo-tbl{border-collapse:separate;border-spacing:0;width:100%;min-width:1080px;table-layout:fixed}
.mo-tbl th{height:36px;font-weight:400;color:var(--sub);text-align:center;border-top:1px solid var(--bd);border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);white-space:nowrap;padding:0 8px}
.mo-tbl th:first-child{border-top-left-radius:4px}
.mo-tbl th:last-child{border-top-right-radius:4px}
.mo-tbl td{height:36px;border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);text-align:center;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.mo-tbl .rail{width:46px;border-left:6px solid var(--gc);padding:0}
.mo-tbl .lft{text-align:left}
.mo-tbl tbody tr:hover td:not(.st),.mo-tbl tbody tr.sel td:not(.st){background:var(--hl)}
.mo-tbl td.st{color:#fff;padding:0 6px;background:var(--c)}
.mo-tbl td.st.nil{background:#C4C4C4}
.mo-tbl .vc{color:var(--sub);font-size:12px;margin-left:4px}
.mo-tbl .sum td{border:0;height:40px;background:#fff!important}
.mo-tbl .sum td.bx{border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);border-left:1px solid var(--bd);padding:6px 8px}
.mo-tbl .sum td.bxl{border-left:0}
.mo-tbl .sum td.lead{border-left:0;border-bottom:0}
.mo-bat{display:flex;height:24px;border-radius:2px;overflow:hidden}
.mo-bat i{display:block;height:100%}
.mo-empty td{height:72px!important;color:var(--sub)}
.sk-monday .cb{border-color:var(--ui);border-radius:4px}
.sk-monday .cb.on,.sk-monday .cb.mix{background:var(--blue);border-color:var(--blue)}
.mo-foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;color:var(--sub)}
.mo-sec{height:32px;padding:0 12px;border:1px solid var(--ui);border-radius:4px;background:#fff;color:var(--tx);display:inline-flex;align-items:center;gap:4px}
.mo-sec:hover{background:var(--hov)}
.mo-sec[disabled]{opacity:.45;cursor:default}
.mo-batch{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;align-items:stretch;height:64px;background:#fff;border-radius:8px;box-shadow:0 15px 50px rgba(0,0,0,.3);overflow:hidden;z-index:40;max-width:calc(100vw - 32px)}
.mo-bn{width:64px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:300}
.mo-bl{display:flex;flex-direction:column;justify-content:center;padding:0 24px 0 16px;font-size:20px;white-space:nowrap}
.mo-bl small{font-size:12px;color:var(--sub)}
.mo-ba{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0 14px;font-size:12px;color:var(--tx)}
.mo-ba:hover{color:var(--blue)}
.mo-ba .i{width:20px;height:20px}
.mo-ba.x{border-left:1px solid var(--bd);padding:0 20px}
.sk-monday .tst{left:50%;top:64px;transform:translateX(-50%);background:#258750;color:#fff;border-radius:4px;padding:10px 16px;box-shadow:0 6px 20px rgba(0,0,0,.2);animation:none}
.sk-monday .tst .tx{flex-direction:row;gap:6px}
.sk-monday .tst .tx b{font-weight:500}
.sk-monday .tst .ac{color:#fff;text-decoration:underline;font-weight:500}

/* =====================================================================
   CLAY
   ===================================================================== */
.sk-clay{--tx:#111111;--sub:#6F6F6F;--bd:#ECECEB;--bd2:#E2E2E0;--hd:#FAFAF9;--hl:#F1F5FE;display:flex;background:#fff;color:var(--tx);font:400 14px/1.4 Inter,system-ui,sans-serif}

.sk-clay .t-warn{background:#FFEFD3;color:#8A5300}
.sk-clay .t-bad{background:#FFE1E1;color:#A3202C}
.sk-clay .t-mute{background:#F0F0EF;color:#555}

.bo-user>span:nth-child(2){flex:1;display:flex;flex-direction:column;min-width:0}
.bo-user b{font-size:14px;font-weight:600}
.bo-user small{color:var(--sub);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.bo-uav{width:36px;height:36px;border-radius:8px;background:#0F172A;color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.bo-user .i{color:var(--sub)}
/* collapsed rail */
.nav-c .bo-side{padding:16px 10px 0;align-items:center}
.nav-c .bo-lt{flex-direction:column;gap:10px;padding:0 0 12px}
.nav-c .bo-word{display:none}
.nav-c .bo-mark{display:block}
.nav-c .bo-ws,.nav-c .bo-gl,.nav-c .bo-ni .lb,.nav-c .bo-user>span:nth-child(2),.nav-c .bo-user>.i,.nav-c .bo-srch .lb{display:none}
.nav-c .bo-srch{width:44px;height:40px;justify-content:center;padding:0;background:none;box-shadow:none}
.nav-c .bo-srch:hover{background:#F0F1F3}
.nav-c .bo-ni{width:44px;justify-content:center;padding:0}
.nav-c .bo-ni .bo-bdg{position:absolute;top:2px;right:2px;min-width:18px;height:18px;font-size:10px;padding:0 4px}
.nav-c .bo-sep{width:40px;margin:8px auto}
.nav-c .bo-gsep{display:block}
.bo-gsep{display:none;height:1px;width:40px;background:var(--bd);margin:8px auto}
.nav-c .bo-user{justify-content:center;padding:12px 0;width:100%}
/* main */
.bo-main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.bo-main>*{flex-shrink:0}
.bo-hd{padding:28px 32px 0}
.bo-tr{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.bo-tr h1{margin:0;font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.02em}
.bo-tr .sp{flex:1}
.bo-acts{display:flex;gap:8px;flex-wrap:wrap}
.bo-btn{height:34px;padding:0 12px;border:1px solid #DCDFE4;border-radius:6px;background:#fff;color:var(--tx2);font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:0 2px 0 rgba(15,23,42,.05)}
.bo-btn:hover{border-color:#C5CAD2;background:#FAFAFB}
.bo-btn .i{color:var(--acc)}
.bo-btn .n{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--acc1);color:var(--acch);font-size:12px;font-weight:600}
.bo-btn.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.bo-pri{height:34px;padding:0 14px;border:1px solid var(--orgh);border-radius:6px;background:var(--org);color:#fff;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:0 2px 0 rgba(15,23,42,.08)}
.bo-pri:hover{background:var(--orgh)}
.bo-tabs{display:flex;gap:28px;margin-top:22px;padding:0 32px;border-bottom:1px solid var(--bd);overflow-x:auto}
.bo-tab{border:0;background:none;padding:0 0 12px;font-size:14px;font-weight:500;color:var(--sub);display:flex;align-items:center;gap:8px;white-space:nowrap;position:relative}
.bo-tab:hover{color:var(--tx)}
.bo-tab::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px 2px 0 0;background:transparent}
.bo-tab.on{color:var(--tx);font-weight:600}
.bo-tab.on::after{background:var(--acc)}
.bo-tab .c{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 7px;border-radius:10px;background:#F1F2F4;color:var(--sub);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.bo-tab.on .c{background:var(--acc1);color:var(--acch)}
.bo-bar{display:flex;gap:8px;flex-wrap:wrap;padding:16px 32px}
.bo-join{display:inline-flex}
.bo-join>.bo-btn{border-radius:6px 0 0 6px}
.bo-colwrap{position:relative;display:inline-flex}
.bo-colwrap>.bo-btn{border-radius:0 6px 6px 0;margin-left:-1px}
.bo-search{flex:1;min-width:240px;height:34px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid #DCDFE4;border-radius:6px;color:var(--sub);box-shadow:inset 0 2px 0 rgba(15,23,42,.04)}
.bo-search:focus-within{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.bo-search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;color:var(--tx)}
.bo-pop{position:absolute;top:calc(100% + 6px);left:0;z-index:40;width:290px;background:#fff;border:1px solid var(--bd);border-radius:8px;box-shadow:0 10px 15px -3px rgba(15,23,42,.1),0 4px 6px -4px rgba(15,23,42,.1);padding:12px}
.bo-pl{font-size:12px;font-weight:600;color:var(--sub);margin:0 0 8px;display:flex;justify-content:space-between}
.bo-pl span{font-weight:400}
.bo-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:3px;background:#F1F2F4;border-radius:8px;margin-bottom:12px}
.bo-seg button{height:28px;border:0;background:none;border-radius:6px;font-size:12px;font-weight:500;color:var(--sub)}
.bo-seg button.on{background:#fff;color:var(--tx);box-shadow:0 1px 2px rgba(15,23,42,.14)}
.bo-cl{display:flex;flex-direction:column;max-height:320px;overflow:auto;border-top:1px solid var(--bd2);padding-top:6px}
.bo-ci{display:flex;align-items:center;gap:10px;height:32px;padding:0 6px;border:0;background:none;border-radius:6px;text-align:left;font-size:14px;color:var(--tx);width:100%}
.bo-ci:hover{background:#F6F7F9}
.bo-ci .lk{margin-left:auto;font-size:12px;color:var(--sub)}
.bo-ci[aria-disabled="true"]{cursor:default;color:var(--sub)}
.bo-ci[aria-disabled="true"]:hover{background:none}
.bo-ci[aria-disabled="true"] .cb{opacity:.5}
.bo-pf{display:flex;justify-content:flex-end;padding-top:8px;border-top:1px solid var(--bd2);margin-top:6px}
.bo-banner{margin:0 32px 12px;text-align:center;padding:8px;border-radius:6px;background:var(--acc1);color:var(--tx2);font-size:14px}
.bo-banner button{border:0;background:none;color:var(--acch);font-weight:600;padding:0 4px}
/* grid */
.bo-grid{flex:1 1 auto!important;min-height:0;overflow:auto;border-top:1px solid var(--bd)}
.bo-grid.pad{padding-bottom:56px}
.bo-tbl{border-collapse:separate;border-spacing:0;width:100%;min-width:1400px;--cx:16px}
.bo-tbl.d-compact{--cx:10px}
.bo-tbl.d-comfortable{--cx:20px}
.bo-tbl th{position:sticky;top:0;z-index:2;height:40px;background:#FAFAF9;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd2);font-size:12px;font-weight:600;color:var(--tx2);text-align:left;padding:0 var(--cx);white-space:nowrap;user-select:none}
.bo-tbl td{border-bottom:1px solid var(--bd2);border-right:1px solid var(--bd2);padding:0 var(--cx);white-space:nowrap;font-variant-numeric:tabular-nums;background:#fff}
.bo-tbl th:last-child,.bo-tbl td:last-child{border-right:0}
.bo-tbl.d-comfortable td{height:52px;font-size:14px}
.bo-tbl.d-standard td{height:44px;font-size:14px}
.bo-tbl.d-compact td{height:34px;font-size:14px}
.bo-tbl.d-compact .bo-b{height:20px;padding:0 8px;font-size:12px}
.bo-tbl .bo-cbc{position:sticky;left:0;z-index:1;width:48px;min-width:48px;text-align:center;color:#94A3B8;font-size:12px;padding:0}
.bo-tbl th.bo-cbc{z-index:4}
.bo-tbl .pinned{position:sticky;z-index:1}
.bo-tbl th.pinned{z-index:4}
.bo-tbl .pinedge{box-shadow:inset -1px 0 0 var(--bd),6px 0 8px -6px rgba(15,23,42,.12)}
.bo-tbl .bo-cbc .cb{display:none}
.bo-tbl thead .bo-cbc .n{display:none}
.bo-tbl thead .bo-cbc .cb{display:inline-grid}
.bo-tbl tr:hover .bo-cbc .n,.bo-tbl tr.sel .bo-cbc .n,.bo-tbl.any .bo-cbc .n{display:none}
.bo-tbl tr:hover .bo-cbc .cb,.bo-tbl tr.sel .bo-cbc .cb,.bo-tbl.any .bo-cbc .cb{display:inline-grid}
.bo-tbl tbody tr:hover td,.bo-tbl tbody tr.sel td{background:var(--hl)}
.bo-tbl .idc{color:var(--acc);font-weight:600}
.bo-tbl .vc{color:#94A3B8;font-size:12px;margin-left:4px;font-family:ui-monospace,Menlo,monospace}
.bo-tbl .vn{max-width:200px}
.bo-tbl .pt{display:inline-block;vertical-align:-3px;margin-left:6px;color:#94A3B8}
.bo-tbl .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--tx2)}
/* column header actions (production pattern: sort · drag · pin, revealed on hover) */
.bo-th{display:flex;align-items:center;gap:4px}
.bo-th .lb{margin-right:2px}
.bo-th button,.bo-th .hg{width:20px;height:20px;border:0;background:none;border-radius:4px;display:inline-grid;place-items:center;padding:0;color:#94A3B8}
.bo-th button:hover{background:#EEEFF1;color:var(--tx2)}
.bo-th .i{width:14px;height:14px}
.bo-th .hg{cursor:grab;opacity:0}
.bo-th .hp{opacity:0}
.bo-th .hs{opacity:.7}
.bo-th .hs.on{opacity:1;color:var(--acc)}
.bo-tbl th:hover .hg,.bo-tbl th:hover .hp,.bo-tbl th:focus-within .hg,.bo-tbl th:focus-within .hp{opacity:1}
.bo-th .hp.on{opacity:1;color:var(--org)}
.bo-th .hp.on .i{fill:var(--org)}
.bo-tbl th.drop{box-shadow:inset 2px 0 0 var(--org)}
.bo-tbl th.dragging{opacity:.5}
.bo-b{display:inline-flex;align-items:center;height:22px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500}
.sk-best .t-info{background:#EFF6FF;color:#1D4ED8}
.sk-best .t-ok{background:#ECFDF3;color:#15803D}
.sk-best .t-warn{background:#FFFBEB;color:#B45309}
.sk-best .t-bad{background:#FEF2F2;color:#B91C1C}
.sk-best .t-mute{background:#F1F5F9;color:#475569}
.sk-best .t-acc{background:#ECFEFF;color:#0E7490}
.sk-best .cb{border-color:#CBD5E1;border-radius:4px}
.sk-best .cb.on,.sk-best .cb.mix{background:var(--acc);border-color:var(--acc)}
.bo-empty{text-align:center;height:140px!important;color:var(--sub)}
.bo-foot{height:52px;display:flex;align-items:center;gap:12px;padding:0 32px;border-top:1px solid var(--bd);color:var(--sub);font-size:14px;background:#fff}
.bo-foot .sp{flex:1}
.bo-lnk{border:0;background:none;color:var(--acc);font-weight:500;display:inline-flex;align-items:center;gap:4px;padding:0;font-size:14px}
.bo-lnk:hover{text-decoration:underline;color:var(--acch)}
.bo-pp{display:inline-flex;align-items:center;gap:4px;border:1px solid #DCDFE4;border-radius:6px;padding:0 8px;height:30px;background:#fff;color:var(--tx);box-shadow:0 2px 0 rgba(15,23,42,.05)}
.bo-pg{display:inline-flex;align-items:center;border:1px solid #DCDFE4;border-radius:6px;overflow:hidden;background:#fff;box-shadow:0 2px 0 rgba(15,23,42,.05)}
.bo-pg button{border:0;background:none;width:30px;height:28px;display:grid;place-items:center;color:var(--tx2)}
.bo-pg button:hover{background:var(--acc1)}
.bo-pg button[disabled]{opacity:.4;cursor:default;background:none}
.bo-pg span{padding:0 12px;color:var(--tx);border-left:1px solid #DCDFE4;border-right:1px solid #DCDFE4;line-height:28px;font-variant-numeric:tabular-nums}
.bo-batch{position:fixed;left:calc(50% + var(--sbw) / 2);bottom:64px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;height:40px;padding:4px;background:#0F172A;color:#fff;border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.28);z-index:40;white-space:nowrap;max-width:calc(100vw - 32px);animation:tin .18s ease-out}
.bo-batch .ct{padding:0 10px;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.bo-batch .sepv{width:1px;height:18px;background:#334155;margin:0 4px}
.bo-batch button{border:0;background:none;color:#fff;height:32px;padding:0 10px;border-radius:6px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500}
.bo-batch button .i{color:#FDBA74}
.bo-batch button:hover{background:#1E293B}
.bo-batch .dg,.bo-batch .dg .i{color:#FCA5A5}
.bo-batch .x{width:32px;padding:0;justify-content:center}
.bo-batch .x .i{color:#94A3B8}
.bo-fab{position:fixed;right:max(24px,env(safe-area-inset-right,0px));bottom:68px;width:48px;height:48px;border-radius:50%;border:0;background:var(--org);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(254,99,1,.35);z-index:20}
.bo-fab .i{width:22px;height:22px}
.sk-best .tst{right:16px;top:60px;left:auto;transform:none;width:320px;background:#fff;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:16px 16px 16px 20px;box-shadow:0 10px 15px -3px rgba(15,23,42,.1),0 4px 6px -4px rgba(15,23,42,.1);overflow:hidden;align-items:flex-start}
.sk-best .tst::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#16A34A}
.sk-best .tst .ok{width:20px;height:20px;color:#16A34A;margin-top:1px}
.sk-best .tst .tx{flex:1}
.sk-best .tst .tx b{font-size:14px;font-weight:600}
.sk-best .tst .tx span{font-size:14px;color:var(--sub)}
.sk-best .tst .ac{color:var(--acc);font-weight:500;font-size:14px}
.sk-best .tst .x{color:var(--sub)}

/* ---------- V1 colour revision: brand orange for the CTA, fills and indicators; ink for text links;
   neutral muted grey for row hover/selected (shadcn bg-muted pattern) ---------- */
.sk-best{--acc:#0F172A;--acch:#0F172A;--acc1:#F1F5F9;--acc2:#E2E8F0;--hl:#F4F5F7}
.bo-ni.on .i{color:var(--org)}
.bo-btn .i{color:#475569}
.bo-btn .n{background:#F1F5F9;color:#334155}
.bo-btn.on{border-color:#94A3B8;box-shadow:0 0 0 1px #94A3B8}
.bo-tab::after{height:3px;border-radius:3px 3px 0 0}
.bo-tab.on::after{background:var(--org)}
.bo-tab.on .c{background:#0F172A;color:#fff}
.bo-search:focus-within{border-color:#94A3B8;box-shadow:0 0 0 3px rgba(148,163,184,.25)}
.bo-tbl .idc{color:var(--tx);font-weight:500;text-underline-offset:3px}
.bo-tbl tbody tr:hover .idc{text-decoration:underline;cursor:pointer}
.sk-best .cb.on,.sk-best .cb.mix{background:var(--org);border-color:var(--org)}
.bo-th .hs.on{color:var(--tx)}
.bo-lnk{color:var(--tx2);text-decoration:underline;text-decoration-color:#CBD5E1;text-underline-offset:3px}
.bo-lnk:hover{color:var(--tx);text-decoration-color:currentColor}
.bo-banner{background:#F8FAFC;box-shadow:inset 0 0 0 1px #E2E8F0}
.bo-banner button{color:var(--tx);text-decoration:underline;text-underline-offset:3px}
.sk-best .tst .ac{color:var(--tx);text-decoration:underline;text-underline-offset:3px}
/* stronger status tints: 100-level fill + 800-level text + hairline ring (badges read at a glance) */
.sk-best .t-info{background:#DBEAFE;color:#1E40AF;box-shadow:inset 0 0 0 1px #BFDBFE}
.sk-best .t-ok{background:#DCFCE7;color:#166534;box-shadow:inset 0 0 0 1px #BBF7D0}
.sk-best .t-warn{background:#FEF3C7;color:#92400E;box-shadow:inset 0 0 0 1px #FDE68A}
.sk-best .t-bad{background:#FEE2E2;color:#991B1B;box-shadow:inset 0 0 0 1px #FECACA}
.sk-best .t-mute{background:#F1F5F9;color:#334155;box-shadow:inset 0 0 0 1px #E2E8F0}
.sk-best .t-acc{background:#CCFBF1;color:#115E59;box-shadow:inset 0 0 0 1px #99F6E4}
/* V1 nav: working search, children, empty state */
.bo-side>*,.p2-panel>*,.p2-rail>*{flex-shrink:0}
.bo-srch{cursor:text}
.bo-srch input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:14px;color:var(--tx)}
.bo-srch input::-webkit-search-cancel-button{display:none}
.bo-srch{gap:8px!important;padding:0 8px 0 10px!important}
.fb-q{min-width:140px}
.bo-srch input::placeholder{color:#94A3B8}
.bo-srch:focus-within{box-shadow:0 0 0 1px #94A3B8,0 0 0 4px rgba(148,163,184,.2)}
.bo-srch kbd,.p2-srch kbd{font:500 12px Inter,system-ui,sans-serif;color:#94A3B8;border:1px solid #E2E8F0;border-radius:4px;padding:1px 5px;background:#fff}
.bo-srchc{cursor:pointer}
.bo-navl{display:flex;flex-direction:column;gap:2px}
.nav-c .bo-navl{align-items:center}
.bo-ex,.p2-ex{margin-left:auto;width:24px;height:24px;border:0;background:none;border-radius:6px;display:grid;place-items:center;color:#94A3B8;padding:0;flex:none}
.bo-ex:hover,.p2-ex:hover{background:#E5E7EB;color:var(--tx2)}
.bo-ex .i,.p2-ex .i{width:14px!important;height:14px!important;transition:transform .15s}
.bo-ex[aria-expanded="false"] .i,.p2-ex[aria-expanded="false"] .i{transform:rotate(-90deg)}
.nav-c .bo-ex{display:none}
.bo-kids,.p2-kids{display:flex;flex-direction:column;gap:1px;margin:2px 0 4px 21px;padding-left:12px;border-left:1px solid var(--bd)}
.bo-ki,.p2-ki{height:32px;display:flex;align-items:center;padding:0 10px;border-radius:6px;color:var(--tx2);font-size:14px;cursor:pointer;white-space:nowrap}
.bo-ki:hover,.p2-ki:hover{background:#F0F1F3}
.bo-kl,.p2-kl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#94A3B8;padding:10px 10px 4px}
.bo-none{color:var(--sub);font-size:14px;padding:8px 10px;margin:0}

/* =====================================================================
   V2 proposal: Sentry-style dark rail in brown for sections, plus a light
   secondary panel for the section's pages (Zoho Mail pattern) that collapses
   ===================================================================== */
.sk-v2p{--sbw:308px;--brown:#2B1A12;--brown2:#4A2C1D;--tan:#FAF7F4;--tan2:#F1E8E1;--tan3:#E7D9CE;--bark:#5C3A27}
.sk-v2p.pan-c{--sbw:76px}
.p2-rail{width:76px;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 0 12px;background:linear-gradient(294deg,#24140C 30%,#3A2216 62%,#4B2D1D 90%);color:rgba(255,255,255,.72)}
.p2-mark{display:grid;place-items:center;height:36px;margin-bottom:6px}
.p2-rsep{width:36px;height:1px;background:rgba(255,255,255,.12);margin:6px 0}
.p2-rail .sp{flex:1}
.p2-rb{position:relative;width:62px;min-height:44px;border:0;background:none;border-radius:10px;color:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 2px;font-size:10px;font-weight:500;letter-spacing:.01em}
.p2-rb .i{width:20px;height:20px}
.p2-rb:hover{background:rgba(255,255,255,.08);color:#fff}
.p2-rb.on{background:rgba(255,255,255,.14);color:#fff}
.p2-rb.cur::before{content:"";position:absolute;left:-7px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--org)}
.p2-dot{position:absolute;top:6px;right:14px;width:8px;height:8px;border-radius:50%;background:#E5484D;box-shadow:0 0 0 2px #3A2216}
.p2-uav{width:36px;height:36px;border-radius:8px;background:#F5EDE6;color:var(--brown);display:grid;place-items:center;font-weight:700;font-size:12px;margin-top:6px}
.p2-panel{width:232px;flex:none;background:var(--tan);border-right:1px solid var(--tan3);display:flex;flex-direction:column;padding:14px 12px;gap:4px;overflow:auto}
.p2-ph{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 10px}
.p2-ph b{font-size:16px;font-weight:700;color:var(--brown)}
.p2-tg{width:28px;height:28px;border:0;background:none;border-radius:6px;display:grid;place-items:center;color:var(--bark)}
.p2-tg:hover{background:var(--tan2)}
.p2-ws{display:flex;align-items:center;gap:8px;width:100%;border:1px solid var(--tan3);background:#fff;padding:9px 12px;border-radius:10px;text-align:left;margin-bottom:8px}
.p2-ws>span{flex:1;display:flex;flex-direction:column;line-height:1.3;min-width:0}
.p2-ws b{font-weight:600;font-size:14px;color:var(--brown)}
.p2-ws small{font-size:12px;color:#8A6F5E}
.p2-srch{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:8px;background:#fff;border:1px solid var(--tan3);color:#8A6F5E;margin-bottom:8px;cursor:text}
.p2-srch:focus-within{border-color:var(--bark);box-shadow:0 0 0 3px rgba(92,58,39,.12)}

/* floating tooltip (one element, positioned by script so scroll containers never clip it) */

#tip{position:fixed;z-index:100;pointer-events:none;background:#0F172A;color:#F8FAFC;font:500 12px/1.45 Inter,system-ui,sans-serif;padding:6px 10px;border-radius:6px;box-shadow:0 6px 16px rgba(15,23,42,.24);width:max-content;max-width:320px;white-space:normal;text-wrap:balance;overflow-wrap:break-word;opacity:0;transition:opacity .12s}

/* ---------- V1 round 3 ---------- */
/* sidebar: 232px expanded / 64px rail; nav scrolls, profile stays pinned at the bottom */
.sk-best{--sbw:232px;--hl:#FFF6EF}
.sk-best.nav-c{--sbw:64px}
.sk-best .bo-side{overflow:hidden;padding:14px 10px 0}

/* selected rows: brand tint shared with hover, plus a 2px brand edge so selection survives hover */
.bo-tbl tbody tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--org)}
/* tab count: brand tint pill with ink text (solid orange + white text fails AA at 11px) */

/* semantic toasts: tinted surface + matching edge and icon so they never vanish on a white page */
.sk-best .tst.tone-success{background:#F0FDF4;border-color:#BBF7D0}.sk-best .tst.tone-success::before{background:#16A34A}.sk-best .tone-success .ok{color:#16A34A}
.sk-best .tst.tone-info{background:#EFF6FF;border-color:#BFDBFE}.sk-best .tst.tone-info::before{background:#2563EB}.sk-best .tone-info .ok{color:#2563EB}
.sk-best .tst.tone-warning{background:#FFFBEB;border-color:#FDE68A}.sk-best .tst.tone-warning::before{background:#D97706}.sk-best .tone-warning .ok{color:#D97706}
.sk-best .tst.tone-error{background:#FEF2F2;border-color:#FECACA}.sk-best .tst.tone-error::before{background:#DC2626}.sk-best .tone-error .ok{color:#DC2626}
.sk-best .tst .tx span{color:#475569}
/* toolbar row */
.bo-bar{align-items:flex-start}
.bo-tools{display:flex;gap:8px;flex:none}

/* filter token bar */
.fb{flex:1;min-width:280px;min-height:36px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:3px 4px;border:1px solid #DCDFE4;border-radius:6px;background:#fff;box-shadow:inset 0 2px 0 rgba(15,23,42,.04)}

.fb-w{position:relative;display:inline-flex}

.fb-saved:hover{background:#E2E8F0}
.fb-saved span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.fb-add .i{width:14px;height:14px}

.fb-q{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;padding:0 8px;color:#94A3B8}
.fb-q input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;color:var(--tx);height:28px}
.fb-savew{gap:0}
.fb-save{height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border:1px solid #DCDFE4;border-radius:4px;background:#fff;color:var(--tx);font-size:14px;font-weight:600;box-shadow:0 2px 0 rgba(15,23,42,.05)}
.fb-save .i{width:14px;height:14px;color:#475569}
.fb-more{height:28px;width:26px;border:1px solid #DCDFE4;border-left:0;border-radius:0 4px 4px 0;background:#fff;display:grid;place-items:center;color:#475569}

.fb-pop{position:absolute;top:calc(100% + 6px);left:0;z-index:45;background:#fff;border:1px solid var(--bd);border-radius:8px;box-shadow:0 10px 15px -3px rgba(15,23,42,.1),0 4px 6px -4px rgba(15,23,42,.1);padding:8px;min-width:240px}
.fb-savew .fb-pop{left:auto;right:0}
.fb-addm{display:grid;grid-template-columns:180px 220px;padding:0;overflow:hidden}
.fb-fl{border-right:1px solid var(--bd2);padding:6px;display:flex;flex-direction:column;gap:2px;background:#FAFAFB}
.fb-fi{height:34px;display:flex;align-items:center;gap:6px;padding:0 10px;border:0;border-radius:6px;background:none;text-align:left;font-size:14px;color:var(--tx2)}
.fb-fi:hover{background:#F1F5F9}
.fb-fi.on{background:#fff;color:var(--tx);font-weight:600;box-shadow:0 1px 2px rgba(15,23,42,.08)}
.fb-fi .fb-n{margin-left:auto}
.fb-vl{padding:6px;max-height:320px;overflow:auto}
.fb-vh{font-size:12px;color:var(--sub);padding:4px 8px 6px}
.fb-vi{width:100%;height:34px;display:flex;align-items:center;gap:10px;padding:0 8px;border:0;border-radius:6px;background:none;text-align:left;font-size:14px;color:var(--tx)}
.fb-vi:hover{background:#F6F7F9}
.fb-ft{border-top:1px solid var(--bd2);margin-top:6px;padding:8px 8px 2px;display:flex;justify-content:flex-end}
.fb-sv{min-width:300px;padding:6px}
.fb-si{display:flex;align-items:center;border-radius:6px}
.fb-si:hover,.fb-si.on{background:#F6F7F9}
.fb-si>button:first-child{flex:1;height:36px;display:flex;align-items:center;gap:8px;padding:0 8px;border:0;background:none;text-align:left;font-size:14px;color:var(--tx);min-width:0}
.fb-si>button:first-child span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fb-si em{font-style:normal;font-size:12px;font-weight:600;color:#9A3412;background:#FFE4CC;border-radius:4px;padding:1px 6px;margin-left:auto;white-space:nowrap}
.fb-si .i{width:14px;height:14px;color:#94A3B8;flex:none}
.fb-del{width:30px;height:30px;border:0;background:none;border-radius:6px;display:grid;place-items:center;color:#94A3B8;margin-right:4px}
.fb-del:hover{background:#FEE2E2;color:#B91C1C}
.fb-empty{margin:0;padding:10px 8px;color:var(--sub);font-size:14px;line-height:1.5;max-width:280px}
.fb-sf{width:300px;padding:14px;display:flex;flex-direction:column;gap:6px}
.fb-sf b{font-size:14px;margin-bottom:4px}
.fb-sf label{font-size:12px;font-weight:500;color:var(--tx2)}
.fb-sf input[type=text]{height:34px;border:1px solid #CBD5E1;border-radius:6px;padding:0 10px;font:inherit;font-size:14px;outline:0}
.fb-sf input[type=text]:focus{border-color:#94A3B8;box-shadow:0 0 0 3px rgba(148,163,184,.25)}
.fb-chk{display:flex;align-items:center;gap:8px;margin-top:6px;font-weight:400!important}
.fb-chk input{accent-color:var(--org)}
.fb-sfa{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.fb-mm{min-width:200px;padding:4px}
.fb-mm button{width:100%;height:34px;border:0;background:none;border-radius:6px;text-align:left;padding:0 10px;font-size:14px;color:var(--tx)}
.fb-mm button:hover{background:#F6F7F9}
/* sort menu */
.bo-sortw>.bo-btn{border-radius:6px!important;margin-left:0!important}
.so-pop{left:auto;right:0;width:240px}
.so-i{width:100%;height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;border:0;background:none;border-radius:6px;font-size:14px;color:var(--tx);text-align:left}
.so-i:hover{background:#F6F7F9}
.so-i.on{font-weight:600}
.so-i .i{width:14px;height:14px;color:var(--org)}
.so-dir{margin:8px 0 0}
.so-dir button[disabled]{opacity:.45;cursor:default}
/* column picker: roomier rows, finder, drag handles */
.bo-tools .bo-colwrap>.bo-btn{border-radius:6px;margin-left:0}

.cp-find{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid #DCDFE4;border-radius:6px;color:#94A3B8;margin-bottom:6px}

.bo-pgn button:hover{background:#F1F5F9}
.bo-pgn button.on{border-color:#DCDFE4;background:#fff;color:var(--tx);font-weight:700;box-shadow:0 2px 0 rgba(15,23,42,.05),inset 0 -2px 0 var(--org)}
.bo-pgn button[disabled]{opacity:.35;cursor:default;background:none}
.bo-pgn .el{width:24px;text-align:center;color:#94A3B8}

/* ---------- V1 round 4 ---------- */
/* one "active" treatment everywhere: 1px light-brand edge + 2px brand bottom stroke (same as the current page button) */
.sk-best{--act-edge:#FDBA74;--act-shadow:inset 0 -2px 0 #FE6301,0 2px 0 rgba(15,23,42,.05)}
.bo-pgn button.on{border-color:var(--act-edge);box-shadow:var(--act-shadow)}
.fb:focus-within,.cp-find:focus-within{border-color:var(--act-edge)!important;box-shadow:inset 0 -2px 0 #FE6301!important}
.bo-srch:focus-within{box-shadow:inset 0 0 0 1px var(--act-edge),inset 0 -2px 0 #FE6301!important}
.fb-sf input[type=text]:focus{border-color:var(--act-edge);box-shadow:inset 0 -2px 0 #FE6301}
.bo-ib2{position:relative;width:36px;height:36px;border:1px solid #DCDFE4;border-radius:6px;background:#fff;color:#475569;display:grid;place-items:center;box-shadow:0 2px 0 rgba(15,23,42,.05)}
.bo-ib2:hover{border-color:#C5CAD2;background:#FAFAFB;color:var(--tx)}
.bo-ib2 .i{width:17px;height:17px}
.bo-ib2.act{border-color:var(--act-edge);box-shadow:var(--act-shadow);color:var(--tx);background:#FFFBF8}
.bo-ib2 .bdot{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#FE6301;color:#431407;font:700 10px/16px Inter,system-ui,sans-serif;font-style:normal;text-align:center;box-shadow:0 0 0 2px #fff}
.bo-tools{align-items:center}
.bo-tools .bo-btn{height:36px}
/* tab count: full brand fill with dark-brown number (5.6:1, passes AA; white on orange is only 3:1) */
.bo-tab.on .c{background:#FE6301;color:#431407;font-weight:700}

.sk-best .tst .tic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--tc);margin-top:-1px}
.sk-best .tst .tic .i{width:13px;height:13px;color:#fff;stroke-width:3}
.sk-best .tone-success{--tc:#16A34A}.sk-best .tone-info{--tc:#2563EB}.sk-best .tone-warning{--tc:#D97706}.sk-best .tone-error{--tc:#DC2626}
/* sidebar: items keep their height; the list scrolls when it runs out of room */
.sk-best .bo-navl>*{flex-shrink:0}
.sk-best .bo-ni{height:36px}
.sk-best .bo-gl{padding:16px 10px 6px}
.sk-best .bo-navl{scrollbar-width:thin}
/* search scrolls with the menu; top padding keeps its focus ring visible */
.sk-best .bo-navl{padding-top:4px}
.sk-best .bo-ws2{margin-bottom:6px!important}
/* bulk bar carries the "select all" suggestion, so the count lives in one place */
.bo-batch .all{color:#FDBA74;font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:0 8px}
.bo-batch .all:hover{background:#1E293B;color:#FED7AA}
.bo-batch .ct b{color:#FDBA74}

/* ---------- V1 round 5 ---------- */
/* 4px active tab bar with rounded top, like Sentry's classic tabs */
.bo-tab::after{height:4px!important;border-radius:4px 4px 0 0!important}
/* brand badges: solid orange, white number */
.bo-tab.on .c,.bo-ib2 .bdot,.fb-n{background:#FE6301!important;color:#fff!important;font-weight:700}
/* collapsed rail: no scrollbar gutter, so icons stay on the centre line */
.nav-c .bo-navl{scrollbar-width:none}
.nav-c .bo-navl::-webkit-scrollbar{display:none}
/* page header: 24px title on a 36px line, matching the 36px buttons so centres share one line */
.bo-hd{padding-top:24px}
.bo-tr h1{font-size:24px;line-height:36px;letter-spacing:-.015em}
.bo-acts .bo-btn,.bo-acts .bo-pri{height:36px}
.bo-tabs{margin-top:18px}

/* ---------- V1 round 6 ---------- */
/* numbers: right-aligned; amounts in mono with a grey currency code (production renderAmountCell) */
.bo-tbl .c-total,.bo-tbl .c-expvar,.bo-tbl .c-pkgs{text-align:right}
.bo-tbl th.h-total .bo-th,.bo-tbl th.h-expvar .bo-th,.bo-tbl th.h-pkgs .bo-th{justify-content:flex-end}
.bo-tbl .amt{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.95em;color:var(--tx)}
.bo-tbl .ccy{margin-left:6px;font-size:12px;color:#94A3B8;font-family:Inter,system-ui,sans-serif}
.bo-tbl .var{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.88em;margin-left:8px}

.bo-ib2.wide{width:auto;padding:0 10px;gap:6px;display:inline-flex;align-items:center;font:600 14px Inter,system-ui,sans-serif;color:var(--tx2);font-variant-numeric:tabular-nums}
/* text fields: wide inputs get a 1px brand edge + soft ring; the 2px bottom stroke stays on small controls */
.fb:focus-within,.cp-find:focus-within{border-color:#FB923C!important;box-shadow:0 0 0 3px rgba(254,99,1,.12)!important}
.bo-srch:focus-within{box-shadow:inset 0 0 0 1px #FB923C,0 0 0 3px rgba(254,99,1,.12)!important}
.fb-sf input[type=text]:focus{border-color:#FB923C;box-shadow:0 0 0 3px rgba(254,99,1,.12)}
/* bulk bar experiment: oxford navy, the classic dark-blue complement to orange */
.bo-batch{background:#14213D;box-shadow:0 8px 24px rgba(20,33,61,.35)}
.bo-batch .sepv{background:#2C3B63}
.bo-batch button:hover,.bo-batch .all:hover{background:#1F2F57}
.bo-batch .x .i{color:#A3B1CF}

/* ---------- V1 round 7 ---------- */
/* tabs: label sits close to its count, tabs sit further apart */
.bo-tab{gap:6px!important}
.bo-tabs{gap:36px!important}
/* ONE interaction rule for every list surface (nav, table rows, menus, cards):
   hover = selected = the same light brand tint (--hov).
   What tells them apart is never colour: selected adds a brand indicator
   (a left bar on nav items, table rows and menu rows; a check where the item is a choice; a 1px brand border on cards). */
.sk-best{--hov:#FFF6EF;--hl:#FFF6EF}
.sk-best .bo-ni:hover,.sk-best .bo-ki:hover,.sk-best .bo-srchc:hover,
.fb-fi:hover,.fb-vi:hover,.so-i:hover,.cp-row:hover,.fb-si:hover,.fb-mm button:hover,.bo-ci:hover{background:var(--hov)!important}
/* nav: selected = tint + 3px brand bar + bold + brand icon */
.sk-best .bo-ni.on{background:var(--hov);box-shadow:inset 3px 0 0 var(--org);font-weight:600}
.nav-c .bo-ni.on{box-shadow:inset 0 -3px 0 var(--org)}
/* table: selected = tint + 2px brand edge + ticked box (already in place) */
/* menus: selected = tint + 2px brand edge + bold (+ check where it is a choice) */
.fb-fi.on,.so-i.on,.fb-si.on{background:var(--hov)!important;box-shadow:inset 2px 0 0 var(--org)!important;font-weight:600;color:var(--tx)}
.fb-vi[aria-checked="true"]{background:var(--hov);box-shadow:inset 2px 0 0 var(--org)}
.bo-seg button.on{box-shadow:0 1px 2px rgba(15,23,42,.14),inset 0 -2px 0 var(--org)}
/* cards (workspace switcher, profile): hover = tint; open/selected = tint + 1px brand border */
.sk-best .bo-ws:hover{background:var(--hov);border-color:#FED7AA}
.sk-best .bo-user{border-radius:10px;cursor:pointer}
.sk-best .bo-user:hover{background:var(--hov)}

/* ---------- V1 round 8: neutral light grey for hover + selected; nav marks selection with icon + weight only ---------- */
.sk-best{--hov:#F3F4F6;--hl:#F3F4F6;--o50:#F3F4F6}
.sk-best .bo-ni.on{box-shadow:none!important}
.nav-c .bo-ni.on{box-shadow:none!important}
.sk-best .bo-ws:hover{border-color:#D1D5DB}

/* ---------- V1 Part 1 ---------- */
/* sidebar: real Freehand mark, clearer workspace switcher, raised white pill for the current page */
.bo-logo{display:inline-flex;align-items:center;gap:7px;font:700 22px/1 Inter,system-ui,sans-serif;letter-spacing:-.4px;color:#0F172A}
.bo-ws2{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:6px 8px;border-radius:8px;text-align:left;margin-bottom:10px}

.bo-ws2 .wst{width:30px;height:30px;border-radius:8px;background:#14213D;color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.bo-ws2 .wsn{flex:1;display:flex;flex-direction:column;min-width:0;line-height:1.25}

function pager(){

  const head=`<div class="fx-h"><div class="fx-ht"><b>${f.label}</b><span>${f.desc}</span></div>${ops.length>1?`<div class="fx-opdd"><button class="fx-opb${S.fxOp?' open':''}" data-a="fxopmenu" aria-haspopup="menu" aria-expanded="${S.fxOp}"><span>${op}</span>${ic('chevD')}</button>${S.fxOp?`<div class="fx-opm" role="menu">${ops.map(o=>`<button class="fx-opi${o===op?' sel':''}" data-a="fxop" data-k="${f.key}" data-v="${o}" role="menuitemradio" aria-checked="${o===op}">${o}${o===op?ic('check'):''}</button>`).join('')}</div>`:''}</div>`:`<span class="fx-opfix">${op}</span>`}</div>`;
  if(noval)return head+`<p class="fx-note">${op==='has error'?'Matches invoices where this field could not be filled in.':'No value needed for this condition.'}</p>`;
  const foot=(n,txt,acts)=>`<div class="fx-foot"><span>${n?txt:'None selected'}</span><span class="acts">${acts}</span></div>`;
  if(f.type==='multi'){
    const opts=fxOpts(f).filter(o=>o.label.toLowerCase().includes(S.fx.vq.toLowerCase())),n=t?t.values.length:0;
    return head+`<label class="fx-s">${ic('search')}<input id="fxvq" class="fxvq" type="search" placeholder="Search ${f.label.toLowerCase()}" value="${S.fx.vq.replace(/"/g,'&quot;')}" aria-label="Search ${f.label}"></label>
      <div class="fx-vals">${opts.map(o=>{const on=!!(t&&t.values.includes(o.value));return `<button class="fx-opt${on?' sel':''}" data-a="fxval" data-k="${f.key}" data-v="${o.value}" role="menuitemcheckbox" aria-checked="${on}">${fakecb(on)}<span class="${o.value==='__none__'?'dash':''}">${o.label}</span></button>`}).join('')||'<p class="fb-empty">No values match.</p>'}</div>
      ${foot(n,`${n} selected`,`<button data-a="fxall" data-k="${f.key}">Select all</button><button data-a="fxclr" data-k="${f.key}" ${n?'':'disabled'}>Clear all</button>`)}`}
  if(f.type==='bool'){const v=t&&t.values[0];
    return head+`<div class="fx-vals">${[['yes','Yes'],['no','No']].map(([k,l])=>`<button class="fx-opt${v===k?' sel':''}" data-a="fxbool" data-k="${f.key}" data-v="${k}" role="menuitemradio" aria-checked="${v===k}"><span class="fx-radio${v===k?' on':''}"></span>${l}</button>`).join('')}</div>${foot(v,'1 selected',`<button data-a="fxclr" data-k="${f.key}" ${v?'':'disabled'}>Clear all</button>`)}`}
  if(f.type==='text'){const vals=t?t.values:[];
    return head+`<label class="fx-s fx-big">${ic('search')}<input id="fxtq" class="fxtq${f.mono?' mono':''}" type="text" placeholder="${f.placeholder}" aria-label="${f.label}" autocomplete="off"></label>
      <p class="fx-hint">Press Enter to add.${f.idList?' Paste a column from Excel to add many at once.':''}</p>
      <div class="fx-vals">${vals.map(v=>`<div class="fx-trow"><span class="${f.mono?'mono':''}">${v}</span><button data-a="fxtx" data-k="${f.key}" data-v="${v}" aria-label="Remove ${v}">${ic('x')}</button></div>`).join('')}</div>
      <div class="fx-foot"><span>${vals.length?`${vals.length} added`:'None added'}</span><span class="acts"><button data-a="fxclr" data-k="${f.key}" ${vals.length?'':'disabled'}>Clear all</button></span></div>`}
  if(f.type==='amount'){const btw=op==='is between';
    const inp=(w,l)=>`<label class="fx-amt"><span class="lb">${l}</span><span class="fx-in"><span class="cur">SGD</span><input id="fx-${w}" class="fxnum" data-k="${f.key}" data-w="${w}" inputmode="decimal" placeholder="0.00" value="${t&&t[w]!=null?t[w]:''}"></span></label>`;
    return head+`<div class="fx-amts">${inp('a',btw?'From':'Amount')}${btw?inp('b','To'):''}</div><div class="fx-foot"><span>${t&&t.a!=null?'1 selected':btw?'Enter both amounts':'None selected'}</span><span class="acts"><button data-a="fxclr" data-k="${f.key}" ${t&&t.a!=null?'':'disabled'}>Clear all</button></span></div>`}
  if(f.type==='date'){
    if(op==='is in the last')return head+`<div class="fx-amts"><label class="fx-amt"><span class="lb">Number of days</span><span class="fx-in"><input id="fx-days" class="fxnum" data-k="${f.key}" data-w="days" inputmode="numeric" placeholder="30" value="${t&&t.days?t.days:''}"><span class="cur">days</span></span></label></div>`;
    if(op==='is between')return head+`<div class="fx-dsplit"><div class="fx-pres">${f.presets.map(([k,l])=>`<button class="fx-opt${t&&t.preset===k?' sel':''}" data-a="fxpre" data-k="${f.key}" data-v="${k}" role="menuitemradio" aria-checked="${!!(t&&t.preset===k)}"><span class="fx-radio${t&&t.preset===k?' on':''}"></span>${l}</button>`).join('')}</div>
      <div class="fx-cust"><span class="lb">Custom range</span><label class="fx-in"><input id="fx-from" class="fxdate" type="date" data-k="${f.key}" data-w="from" value="${t&&!t.preset&&t.from?t.from:''}"></label><label class="fx-in"><input id="fx-to" class="fxdate" type="date" data-k="${f.key}" data-w="to" value="${t&&!t.preset&&t.to?t.to:''}"></label></div></div>
      <div class="fx-foot"><span>${t&&(t.preset||t.from)?'1 selected':'None selected'}</span><span class="acts"><button data-a="fxclr" data-k="${f.key}" ${t&&(t.preset||t.from)?'':'disabled'}>Clear all</button></span></div>`;
    return head+`<div class="fx-amts"><label class="fx-amt"><span class="lb">Date</span><span class="fx-in"><input id="fx-from" class="fxdate" type="date" data-k="${f.key}" data-w="from" value="${t&&t.from?t.from:''}"></span></label></div>`}
  return head;
}
function fxMenu(){
  const lk=S.ctx==='ex'&&S.ex.drill&&S.ex.scope?S.ex.scope.map(t=>t.key):[];
  if(lk.includes(S.fx.field)){const fr=CFG().fields.find(x=>!lk.includes(x.key));if(fr)S.fx.field=fr.key}
  const f=FXF(S.fx.field),q=S.fx.q.toLowerCase();
  const list=CFG().fields.filter(x=>(S.fx.tab==='All'||x.cat===S.fx.tab)&&x.label.toLowerCase().includes(q));
  const groups=CFG().cats.map(c=>[c,list.filter(x=>x.cat===c)]).filter(g=>g[1].length);
  return `<div class="fx-pop" data-menu role="dialog" aria-label="Add a filter">
    <div class="fx-l">
      <div class="fx-tabs" role="tablist">${['All',...CFG().cats].map(c=>`<button class="fx-tab${S.fx.tab===c?' on':''}" data-a="fxtab" data-v="${c}" role="tab" aria-selected="${S.fx.tab===c}">${c}</button>`).join('')}</div>
      <label class="fx-s">${ic('search')}<input id="fxq" class="fxq" type="search" placeholder="Search ${S.fx.tab==='All'?'fields':S.fx.tab.toLowerCase()+' fields'}" value="${S.fx.q.replace(/"/g,'&quot;')}" aria-label="Search fields"></label>
      <div class="fx-list">${groups.map(([c,fs])=>`<div class="fx-sec">${c}</div>${fs.map(x=>{if(lk.includes(x.key))return `<div class="fx-row lk" aria-disabled="true" data-tip="Set by this group · Unlock to change"><span class="lb">${x.label}</span>${ic('lock')}</div>`;const t=fxGet(x.key),n=t&&fxCount(t);return `<button class="fx-row${x.key===S.fx.field?' hi':''}" data-fxf="${x.key}" data-a="fxfield" data-v="${x.key}"><span class="lb">${x.label}</span>${n?`<span class="fx-cnt">${n}</span>`:''}${ic('chevR')}</button>`}).join('')}`).join('')||'<p class="fb-empty">No fields match.</p>'}</div>
    </div>
    <div class="fx-r">${f?fxEditor(f):''}</div>
  </div>`;
}
function fxBar(){

    ${S.fxt.length?`<button class="fx-clear" data-a="fxclear" aria-label="Clear all filters" data-tip="Clear all filters">${ic('x')}</button>`:''}

}

function rszApply(tbl,k,w){tbl.querySelectorAll(`.h-${k}`).forEach(th=>{th.style.width=th.style.minWidth=th.style.maxWidth=w+'px';th.classList.add('wset')});tbl.querySelectorAll(`td.c-${k}`).forEach(td=>{td.style.maxWidth=w+'px';td.classList.add('wset')})}
document.addEventListener('pointerdown',e=>{const h=e.target.closest&&e.target.closest('.rsz');if(!h)return;e.preventDefault();e.stopPropagation();
  const th=h.closest('th');th.draggable=false;hideTip();rsz={k:h.dataset.rsz,x:e.clientX,w:th.getBoundingClientRect().width,tbl:th.closest('table'),h};h.classList.add('on');document.body.classList.add('resizing')},true);
document.addEventListener('pointermove',e=>{if(!rsz)return;const w=Math.max(60,Math.round(rsz.w+e.clientX-rsz.x));rsz.cur=w;rszApply(rsz.tbl,rsz.k,w);layoutPins()});
document.addEventListener('pointerup',()=>{if(!rsz)return;const r=rsz;rsz=null;document.body.classList.remove('resizing');r.h.classList.remove('on');const th=r.h.closest('th');if(th)th.draggable=true;if(r.cur&&Math.abs(r.cur-r.w)>1){S.colW[r.k]=r.cur;render()}});
document.addEventListener('dblclick',e=>{const h=e.target.closest&&e.target.closest('.rsz');if(!h)return;delete S.colW[h.dataset.rsz];render()});
document.addEventListener('keydown',e=>{const h=e.target.closest&&e.target.closest('.rsz');if(!h||(e.key!=='ArrowLeft'&&e.key!=='ArrowRight'))return;e.preventDefault();
  const th=h.closest('th'),base=th.getBoundingClientRect().width,step=(e.shiftKey?40:12)*(e.key==='ArrowRight'?1:-1);S.colW[h.dataset.rsz]=Math.max(60,Math.round(base+step));const id=h.dataset.rsz;render();app.querySelector(`.rsz[data-rsz="${id}"]`)?.focus()});
let dragCol=null;
document.addEventListener('dragstart',e=>{const th=e.target.closest&&e.target.closest('[data-col]');if(!th)return;dragCol=th.dataset.col;th.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragCol)}catch(_){}});
document.addEventListener('dragover',e=>{const th=e.target.closest&&e.target.closest('[data-col]');if(!th||!dragCol)return;e.preventDefault();app.querySelectorAll('.drop').forEach(x=>x.classList.remove('drop'));if(th.dataset.col!==dragCol)th.classList.add('drop')});
document.addEventListener('drop',e=>{const th=e.target.closest&&e.target.closest('[data-col]');if(!th||!dragCol)return;e.preventDefault();const to=th.dataset.col;if(to!==dragCol){const o=(S.colOrder||CFG().cols.map(c=>c[0])).filter(k=>k!==dragCol);o.splice(o.indexOf(to),0,dragCol);S.colOrder=o}dragCol=null;render()});
document.addEventListener('dragend',()=>{dragCol=null;app.querySelectorAll('.drop,.dragging').forEach(x=>x.classList.remove('drop','dragging'))});
/* exception detail side panel: opens from a row, J/K or ↑/↓ steps through the list, Esc closes */
function exSheet(){
  const r=S.ex.view&&EX_ROWS.find(x=>x.id===S.ex.view);if(!r)return '';
  const list=exNavList(),i=list.findIndex(x=>x.id===r.id),m=n=>`${n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}<em>${r.ccy}</em>`;
  const nav=i>=0?`<div class="dk-rn"><button class="prev" ${i>0?`data-a="exview" data-v="${list[i-1].id}" data-tip="Previous exception (K or ↑)"`:'disabled'} aria-label="Previous exception">${ic('chevL')}</button><span aria-live="polite" data-tip="Exception ${i+1} of ${list.length} in this list">${(i+1).toLocaleString()} of ${list.length.toLocaleString()}</span><button class="next" ${i<list.length-1?`data-a="exview" data-v="${list[i+1].id}" data-tip="Next exception (J or ↓)"`:'disabled'} aria-label="Next exception">${ic('chevR')}</button></div>`:'';
  const st=`<span class="bo-b t-${r.st==='Open'?'bad':r.st==='Resolved'?'ok':'org'}">${r.st}</span>`,dash='<span class="dash">—</span>';
  const row=(l,v)=>`<dt>${l}</dt><dd>${v}</dd>`;
  const invL=`<button class="dx-invl" data-a="exinvopen" data-v="${r.inv}" data-tip="Open ${r.inv} in Invoices (new tab)">${r.inv}${ic('ext')}</button>`;
  return `<div class="exs-scrim" data-a="exviewx" aria-hidden="true"></div><aside class="exs" role="dialog" aria-modal="true" aria-labelledby="exs-t">
    <div class="exs-h"><div class="exs-t"><h2 id="exs-t" data-tip="${scase(exCode(r.code))}" data-trunc>${scase(exCode(r.code))}</h2>${st}<span class="sp"></span>${nav}<button class="exs-x" data-a="exviewx" aria-label="Close" data-tip="Close (Esc)">${ic('x')}</button></div>
      <p class="exs-rule">${ruleTxt(r.rule)} · ${r.desc}</p>
      <div class="exs-m">Invoice ${invL}<span class="ex-dot">·</span>${vendorCell(r.scac,r.vendor,r.mode)}</div></div>
    <div class="exs-b">
      <section class="exs-c"><h3>Amounts</h3><div class="exs-amt"><div><small>Billed</small><b>${m(r.billed)}</b></div><div><small>Expected</small><b>${m(r.expected)}</b><span>Contract amount</span></div><div><small>Variance</small><b class="${r.variance>0?'red':''}">${r.variance>0?'+':''}${m(r.variance)}</b><span>${r.variance>0?'Overcharge':r.variance<0?'Undercharge':'No variance'}</span></div></div></section>
      <section class="exs-c exs-det"><h3>Exception detail</h3><p>${exExplain(r)}</p><p class="rl">Rule: ${ruleTxt(r.rule)}</p></section>
      <section class="exs-c"><h3>Ownership</h3><dl class="exs-dl">${row('Team',EX_TEAMS[r.team]||'No team')}${row('Assignee',r.assignee==='__none__'?'Unassigned':EX_PEOPLE[r.assignee])}${row('Blocking payment',r.blocking?'Yes. The invoice is held until this is resolved.':'No')}</dl></section>
      <section class="exs-c"><h3>Shipment</h3><dl class="exs-dl">${row('Mode',modeCell(r.mode))}${row('Lane',r.lane||dash)}${row('Service',r.service||dash)}${row('Weight band',r.weight||dash)}${row('Tracking number',r.tracking?`<span class="mono">${r.tracking}</span>`:dash)}</dl></section>
      <section class="exs-c"><h3>Invoice ${invL}</h3><dl class="exs-dl">${row('Status',`<span class="bo-b t-${TONE[r.invStatus]||'mute'}">${r.invStatus}</span>`)}${row('Type',r.invType)}${row('Billed by',r.billedBy)}${row('Invoice date',fmtD(r.invDate))}${row('Received',fmtD(r.received))}${row('Due date',fmtD(r.due))}</dl></section>
    </div>
    <div class="exs-f"><span class="mu">${r.id} · J/K to move · Esc to close</span><span class="sp"></span>${r.st==='Open'?`<button class="bo-pri" data-a="exta" data-id="${r.id}">Take action${ic('chevR')}</button>`:`<span class="mu">${r.st==='Disputed'?'In a dispute docket. Resolve it there.':'Resolved. Nothing to do.'}</span>`}</div>
  </aside>`;
}
/* panel order follows the screen: group by group when grouped, else the list order */
const exNavList=()=>S.ex.group.length?exGroups(v1Rows()).flatMap(g=>g.rows):v1Rows();
/* exception → Invoices: the invoice, filtered by its number (opened in a new tab via #exinv=) */
function exInvApply(inv){
  let r=S.rows.find(x=>x.id===inv);if(!r){r={...S.rows[inv.length%S.rows.length],id:inv};S.rows.unshift(r)}
  S.route='invoices';useCtx('inv');S.tab='All';S.q='';S.fxt=[];fxEnsure('invoice').values=[inv];S.page=1;S.sel.clear();
}
document.addEventListener('keydown',e=>{if(!S||S.route!=='exceptions'||!S.ex||!S.ex.view)return;
  if(S.ex.act||S.exReject||S.exTeam||S.exConfirm)return;
  const t=e.target;if(t.closest&&t.closest('input,textarea,select,[contenteditable]'))return;
  if(e.key==='Escape'){e.stopPropagation();S.ex.view=null;render();return}
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key,d=k==='j'||k==='J'||k==='ArrowDown'?1:k==='k'||k==='K'||k==='ArrowUp'?-1:0;if(!d)return;
  const L=exNavList(),i=L.findIndex(x=>x.id===S.ex.view),n=L[i+d];e.preventDefault();if(n){S.ex.view=n.id;render()}},true);
/* docket → Invoices: the docket's invoices, filtered by a "Dispute docket" chip (opened in a new tab via #dkinv=) */
function dkInvApply(id){
  const d=DK.find(x=>String(x.id)===String(id));if(!d)return;
  [...new Set(d.items.map(x=>x.inv))].forEach((inv,k)=>{let r=S.rows.find(x=>x.id===inv);
    if(!r){r={...S.rows[(d.items.length*7+k*13)%S.rows.length],id:inv};S.rows.unshift(r)}
    Object.assign(r,{hasDispute:true,docket:d.name})});
  S.route='invoices';useCtx('inv');S.tab='All';S.q='';S.fxt=[];fxEnsure('docket').values=[d.name];S.page=1;S.sel.clear();
}
if(location.hash.startsWith('#dkinv='))dkInvApply(decodeURIComponent(location.hash.slice(7)));
if(location.hash.startsWith('#exinv='))exInvApply(decodeURIComponent(location.hash.slice(7)));
render();
</script>
